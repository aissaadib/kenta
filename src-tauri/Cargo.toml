[package]
name = "clipvault"
version = "0.1.0"
description = "Lightweight gaming replay buffer and clip manager"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
# `cdylib` is only needed for mobile targets. On Windows it produces a 14 MB
# app_lib.dll that the desktop executable never loads, but Tauri's MSI bundler
# globs every *.dll in the output directory and ships it anyway.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.33", features = ["bundled"] }
uuid = { version = "1.17", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
thiserror = "1.0"
windows-sys = { version = "0.59", features = [
  "Win32",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
rfd = "0.12"

[profile.release]
# Ship one optimised, symbol-free executable instead of a 27 MB binary full of
# linker metadata. LTO is worth the extra build time for an end-user app.
codegen-units = 1
lto = true
strip = true

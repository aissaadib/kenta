<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kenta Clip</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #icon {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      pointer-events: none;
    }
    #icon img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      pointer-events: none;
    }
    #icon svg {
      width: 64px;
      height: 64px;
      fill: #f5ff2e;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="icon"></div>
  <script>
    const ICONS = {
      bell: `<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>`,
      save: `<svg viewBox="0 0 24 24"><path d="M19 21H5v-2a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v15a2 2 0 0 1-2 2zM7 6V5a1 1 0 0 1 1-1h3l1 4 1-4h3a1 1 0 0 1 1 1v1z"/></svg>`,
      camera: `<svg viewBox="0 0 24 24"><path d="M3 3v18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V3zM9 17v-5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v5zM13 3a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v1h6z"/></svg>`,
      clip: `<svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17l2-1.8V9L12 3z"/></svg>`,
    };

    const params = new URLSearchParams(window.location.search);
    const kind = params.get('icon') || 'bell';
    const container = document.getElementById('icon');

    // Custom image from localStorage set by the backend.
    const storedIcon = localStorage.getItem('kenta-overlay-icon');
    const storedImage = localStorage.getItem('kenta-overlay-image');

    if (storedIcon === 'custom' && storedImage) {
      const img = document.createElement('img');
      img.src = storedImage;
      img.onerror = () => {
        // Fall back to default bell if the image fails to load.
        container.innerHTML = ICONS.bell;
      };
      container.appendChild(img);
    } else {
      container.innerHTML = ICONS[kind] || ICONS.bell;
    }

    // Auto-hide after 2 seconds.
    setTimeout(() => {
      try { window.close(); } catch (_) {}
    }, 2000);
  </script>
</body>
</html>
